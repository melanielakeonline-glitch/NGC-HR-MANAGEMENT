<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily checks · NGC</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,700,100;9..144,900,100&family=Outfit:wght@400;500;600;700&display=swap">
<link rel="icon" type="image/png" href="/stars/favicon.png">
<link rel="apple-touch-icon" href="/stars/ngc-icon.png">
<meta name="theme-color" content="#FFC95C">
<style>
/* Phone-first single column: yellow header band with who/store/day, sticky tabs, one panel per tab */
:root{
  --bg:#FBF9FD; --surface:#FFFFFF; --ink:#24123A; --muted:#6E6283; --line:#E6DEF0;
  --accent:#3E1466; --accent-soft:#EFE9F7; --on-accent:#FFFFFF;
  --ok:#2E7A4C; --ok-soft:#E3F2E8; --warn:#B3261E; --warn-soft:#FCE8E6; --gold:#9A6A00; --gold-soft:#FFF3D1;
  --brand:#3E1466; --brand-yellow:#FFC95C;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140D1D; --surface:#1E1529; --ink:#F1ECF8; --muted:#B3A7C6; --line:#33284A;
  --accent:#C9B5F2; --accent-soft:#2C2142; --on-accent:#1A0F2B;
  --ok:#6CCB92; --ok-soft:#1C3326; --warn:#FF9C92; --warn-soft:#3D1B19; --gold:#FFC95C; --gold-soft:#3A2E12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140D1D; --surface:#1E1529; --ink:#F1ECF8; --muted:#B3A7C6; --line:#33284A;
  --accent:#C9B5F2; --accent-soft:#2C2142; --on-accent:#1A0F2B;
  --ok:#6CCB92; --ok-soft:#1C3326; --warn:#FF9C92; --warn-soft:#3D1B19; --gold:#FFC95C; --gold-soft:#3A2E12; color-scheme:dark}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.wide .wrap{max-width:1000px}
.top{background:var(--brand-yellow);color:var(--brand)}
.top .wrap{padding-block:22px 18px;display:grid;gap:12px}
.brandrow{display:flex;gap:12px;align-items:center}
.brand-icon{width:52px;height:52px;flex:0 0 52px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0;opacity:.88}
h1{font-family:var(--display);font-weight:900;font-variation-settings:'SOFT' 100;font-size:clamp(36px,9vw,52px);line-height:.95;margin:0;letter-spacing:-.02em}
.daterow{margin:0;font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:rgba(62,20,102,.1)}
.seg button{border:0;background:transparent;color:var(--brand);font:600 14px var(--body);padding:6px 13px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.who{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.who label{font-weight:700;font-size:14px;color:var(--brand)}
.who select{font:600 15px var(--body);color:#24123A;background:#fff;border:2px solid var(--brand);border-radius:10px;padding:8px 10px;min-width:200px;max-width:100%}
.who select.need{border-color:#B3261E;box-shadow:0 0 0 3px rgba(179,38,30,.25)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 15px var(--body);padding:13px 9px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .dot{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;font-size:12px;line-height:20px;background:var(--accent-soft);color:var(--accent);text-align:center}
nav.tabs .dot.done{background:var(--ok-soft);color:var(--ok)}
main .wrap{padding-block:18px 56px;display:grid;gap:16px}
section.panel{display:grid;gap:16px}
h2{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1;margin:0}
h3{font-family:var(--display);font-weight:700;font-size:19px;margin:0}
.lede{margin:0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.card.warnbox{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:10px 18px;font:700 15px var(--body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--muted);font:600 13px var(--body);cursor:pointer;padding:2px 4px;text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{font-weight:600;font-size:13px;display:grid;gap:6px}
input[type=text],input[type=password],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:64px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.todo{background:var(--gold-soft);color:var(--gold)}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok)}
/* Today */
.sum{display:grid;gap:10px}
.sum button.card{text-align:left;font:inherit;color:inherit;cursor:pointer}
.sum .big{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.todo-list{margin:0;padding-left:20px;display:grid;gap:4px}
/* Temperatures */
.unit{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.unit:first-of-type{border-top:0;padding-top:4px}
.unit .nm{font-weight:600}
.unit .rg{font-size:13px;color:var(--muted)}
.reading{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.reading .val{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.reading .val.bad{color:var(--warn)}
.entry{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.entry input{width:84px;text-align:right;font-size:18px;font-weight:700;padding:8px 10px}
.sign{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font:800 18px var(--body);width:40px;height:42px;cursor:pointer}
.unit .meta,.task .meta{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fix{grid-column:1/-1;display:grid;gap:10px;padding:12px;border-radius:12px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.fix p{margin:0;font-weight:600;color:var(--warn)}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:14px}
.opt input{width:18px;height:18px;margin-top:2px;flex:0 0 18px}
/* Cleaning / toilet ticks */
.task{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0;padding-top:2px}
.tick{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;color:var(--on-accent);font:800 18px var(--body);padding:0}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tick:disabled{cursor:default}
.task .tx{font-weight:500}
.task.done .tx{color:var(--muted)}
.task .meta{grid-column:2}
.done-banner{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-weight:700}
.done-banner.warn{background:var(--warn-soft);color:var(--warn)}
/* History */
.hday{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.hday:first-child{border-top:0;padding-top:0}
.hday summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;list-style:none}
.hday summary::-webkit-details-marker{display:none}
.hday summary b{font-family:var(--display);font-size:18px;min-width:150px}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
td.num{text-align:right;white-space:nowrap}
tr.bad td{background:var(--warn-soft)}
table.grid td,table.grid th{text-align:center}
table.grid td:first-child,table.grid th:first-child{text-align:left}
.gate{max-width:420px;margin:28px auto;display:grid;gap:14px}
.foot{padding-block:0 40px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:min(92vw,520px);z-index:20;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#toast button{background:none;border:0;color:var(--brand-yellow);font:700 14px var(--body);cursor:pointer;text-decoration:underline;padding:0}
.offline{background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:600}
@media print{
  .top,nav.tabs,.foot,#toast,.noprint{display:none!important}
  body{background:#fff;color:#000;font-size:11px}
  .card{border:0;padding:0}
  details{display:block}
  .hday{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <img class="brand-icon" src="/stars/ngc-icon.png" alt="">
      <div>
        <p class="eyebrow" id="eyebrow">Nonna Goes Crazy</p>
        <h1>Daily checks</h1>
      </div>
    </div>
    <p class="daterow" id="daterow"></p>
    <div class="row" id="header-controls" hidden>
      <div class="seg" id="day-seg" role="group" aria-label="Day"></div>
      <div class="seg" id="store-seg" role="group" aria-label="Store"></div>
    </div>
    <div class="who" id="who-row" hidden>
      <label for="who">Who's doing the checks?</label>
      <select id="who"></select>
    </div>
  </div>
</header>

<section class="wrap gate" id="gate" hidden>
  <div class="card">
    <h2>Log in</h2>
    <p class="lede">Type the team code from the HR Nonna group chat. This phone or tablet will remember it.</p>
    <form id="gate-form" class="row">
      <label for="g-code" style="flex:1 1 200px">Team code<input type="password" id="g-code" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Open</button>
    </form>
    <p class="small muted" id="g-msg" role="status"></p>
  </div>
</section>

<nav class="tabs" hidden><div class="wrap" role="tablist" id="tabs"></div></nav>

<main hidden>
  <div class="wrap">
    <div class="offline" id="offline" hidden>Can't reach the database right now. Your last changes may not be saved; try again in a moment.</div>
    <section class="panel" id="p-today" hidden></section>
    <section class="panel" id="p-temp" hidden></section>
    <section class="panel" id="p-clean" hidden></section>
    <section class="panel" id="p-toilet" hidden></section>
    <section class="panel" id="p-history" hidden></section>
  </div>
</main>

<footer class="wrap foot" id="foot" hidden>
  <button class="link" type="button" id="mgr-btn">Manager login</button>
  <a class="link" href="/stars">Our Stars</a>
  <a class="link" href="/">Schedule</a>
  <button class="link" type="button" id="logout-btn">Log out</button>
</footer>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="/stars/config.js"></script>
<script src="/checks/checks-config.js"></script>
<script>
const CFG=window.STARS_CONFIG||{};
const C=window.CHECKS_CONFIG||{stores:[],temperatures:{times:[],units:[],actions:[]},cleaning:[],toilet:{checks:[],items:[]},closedDays:[]};
const STORES=(C.stores||[]).filter(s=>s.active!==false);
const MGMT=[{id:'mgmt:melanie',name:'Melanie',role:'Manager'},{id:'mgmt:matteo',name:'Matteo',role:'Owner'},{id:'mgmt:angelica',name:'Angelica',role:'Owner'},{id:'mgmt:luca',name:'Luca',role:'Owner'}];
const TZ='Europe/Lisbon';
const $=s=>document.querySelector(s);
function h(tag,props,...kids){const el=document.createElement(tag);for(const [k,v] of Object.entries(props||{})){if(v==null||v===false)continue;if(k==='class')el.className=v;else if(k==='text')el.textContent=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else el.setAttribute(k,v===true?'':v);}for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)));}return el;}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const isoToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const fmtDate=(iso,opts)=>new Date(iso+'T12:00:00Z').toLocaleDateString('en-GB',Object.assign({timeZone:'UTC',weekday:'long',day:'numeric',month:'long'},opts||{}));
const fmtTime=ts=>new Date(ts).toLocaleTimeString('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
const weekday=iso=>new Date(iso+'T12:00:00Z').getUTCDay();
const forStore=(list,st)=>(list||[]).filter(x=>!x.stores||x.stores.includes(st));
const fmtTemp=v=>String(Number(v)).replace('.',',')+' °C';
const rangeText=u=>`${String(u.min).replace('.',',')} to ${String(u.max).replace('.',',')} °C`;

// Shared with the Stars board: same team code, manager password and device id.
const LS='ngc-stars';
const dev=(()=>{let d={};try{d=JSON.parse(localStorage.getItem(LS)||'{}')||{};}catch(e){}
  if(!d.token)d.token=Array.from(crypto.getRandomValues(new Uint8Array(24)),b=>b.toString(16).padStart(2,'0')).join('');return d;})();
const saveDev=()=>{try{localStorage.setItem(LS,JSON.stringify(dev));}catch(e){}};saveDev();
const mine=(()=>{try{return JSON.parse(localStorage.getItem('ngc-checks-mine')||'{}')||{};}catch(e){return {};}})();
const saveMine=()=>{const cut=Date.now()-15*60e3;for(const [k,t] of Object.entries(mine))if(t<cut)delete mine[k];try{localStorage.setItem('ngc-checks-mine',JSON.stringify(mine));}catch(e){}};

const S={code:dev.code||null,mgr:dev.mgr||null,store:lsGet('ngc-checks-store')||(STORES[0]||{}).id,today:isoToday(),day:isoToday(),
  tab:lsGet('ngc-checks-tab')||'today',who:lsGet('ngc-checks-who')||'',staff:[],rows:[],periodic:[],loaded:false,offline:false,
  drafts:{},fixing:null,busy:new Set(),hist:{from:addDays(isoToday(),-6),to:isoToday(),store:null,rows:null,loading:false}};
if(!STORES.some(s=>s.id===S.store))S.store=(STORES[0]||{}).id;

async function rpc(fn,args){
  const headers={'Content-Type':'application/json',apikey:CFG.key};
  if(String(CFG.key||'').startsWith('eyJ'))headers.Authorization='Bearer '+CFG.key;
  let res;try{res=await fetch(`${String(CFG.url).replace(/\/$/,'')}/rest/v1/rpc/${fn}`,{method:'POST',headers,body:JSON.stringify(args||{})});}catch(e){throw {code:'offline'};}
  const txt=await res.text();let body=null;try{body=txt?JSON.parse(txt):null;}catch(e){}
  if(!res.ok)throw {code:(body&&body.message)||'error',status:res.status};
  return body;
}
const ERR={bad_code:'That team code is not right.',bad_password:'That manager password is not right.',wrong_day:'You can only log checks for today or yesterday.',
  action_needed:'Say what you did about it.',value_needed:'Type the temperature first.',name_needed:"Choose who's doing the checks first.",cannot_undo:'Too late to undo. Ask the manager to remove it.',
  offline:"Can't reach the database. Check the connection and try again.",'Could not find the function':'The checks database is not set up yet. Tell the manager.'};
function errText(e){const c=(e&&e.code)||'';if(c==='bad_code')logout();if(c==='bad_password')logoutMgr();
  for(const [k,v] of Object.entries(ERR))if(c===k||c.startsWith(k))return v;return "Couldn't save. Check the connection and try again.";}
let toastT;function toast(msg,action){const t=$('#toast');t.replaceChildren(...[h('span',{},msg),action?h('button',{type:'button',onclick:()=>{t.hidden=true;action.fn();}},action.label):null].filter(Boolean));t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,action?8000:3500);}

// ---------- people ----------
const staffHere=()=>S.staff.filter(p=>p.store===S.store);
function people(){return [...staffHere().map(p=>({id:p.id,name:p.name})),...MGMT.map(m=>({id:m.id,name:`${m.name} (${m.role})`,short:m.name}))];}
const whoPerson=()=>people().find(p=>p.id===S.who)||null;
function needWho(){if(whoPerson())return false;toast("First choose who's doing the checks (at the top).");const sel=$('#who');sel.classList.add('need');sel.focus();sel.scrollIntoView({block:'center',behavior:'smooth'});return true;}

// ---------- data helpers ----------
const latest=(kind,item,slot)=>{let r=null;for(const x of S.rows)if(x.kind===kind&&x.item===item&&(x.slot||'')===(slot||''))r=x;return r;};
const entriesFor=(kind,item,slot)=>S.rows.filter(x=>x.kind===kind&&x.item===item&&(x.slot||'')===(slot||''));
const dailyGroups=day=>(C.cleaning||[]).filter(g=>(g.every||'day')==='day'&&(!g.days||g.days.includes(weekday(day))));
const periodGroups=()=>(C.cleaning||[]).filter(g=>g.every==='week'||g.every==='month');
const lastOfMonth=iso=>{const [y,m]=iso.split('-').map(Number);return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10);};
const periodStart=(g,day)=>g.every==='week'?addDays(day,-((weekday(day)+6)%7)):day.slice(0,8)+'01';
const periodEnd=(g,day)=>g.every==='week'?addDays(periodStart(g,day),6):lastOfMonth(day);
const allClean=()=>{const m=new Map();for(const r of [...S.periodic,...S.rows])m.set(r.id,r);return [...m.values()].sort((a,b)=>String(a.at).localeCompare(String(b.at)));};
function periodDone(g,t,day,rows){const a=periodStart(g,day),b=periodEnd(g,day);let r=null;for(const x of rows)if(x.kind==='clean'&&x.item===t.id&&x.slot===g.id&&x.day>=a&&x.day<=b)r=x;return r;}
function periodCount(g,st,day,rows){const ts=forStore(g.tasks,st);return [ts.filter(t=>periodDone(g,t,day,rows)).length,ts.length];}
const fmtShort=iso=>fmtDate(iso,{weekday:'short',day:'numeric',month:'short'});
function progressFor(rows,st,day){
  const has=(k,i,s)=>rows.some(x=>x.day===day&&x.kind===k&&x.item===i&&(x.slot||'')===(s||''));
  const units=forStore(C.temperatures.units,st);let tDone=0,tAll=0,warn=0;
  for(const t of C.temperatures.times)for(const u of units){tAll++;const l=[...rows].reverse().find(x=>x.day===day&&x.kind==='temp'&&x.item===u.id&&x.slot===t.id);if(l){tDone++;if(!l.ok)warn++;}}
  let cDone=0,cAll=0;for(const g of dailyGroups(day))for(const tk of forStore(g.tasks,st)){cAll++;if(has('clean',tk.id,g.id))cDone++;}
  let wDone=0,wAll=0;for(const c of C.toilet.checks){wAll++;const l=[...rows].reverse().find(x=>x.day===day&&x.kind==='toilet'&&x.item==='toilet'&&x.slot===c.id);if(l){wDone++;if(!l.ok)warn++;}}
  return {tDone,tAll,cDone,cAll,wDone,wAll,warn};
}
const itemName=(kind,item,slot)=>{
  if(kind==='temp')return ((C.temperatures.units||[]).find(u=>u.id===item)||{}).name||item;
  if(kind==='clean'){for(const g of C.cleaning){const t=(g.tasks||[]).find(x=>x.id===item);if(t)return t.name;}return item;}
  return 'Toilet';
};
const slotName=(kind,slot)=>{
  if(kind==='temp')return ((C.temperatures.times||[]).find(t=>t.id===slot)||{}).label||slot;

        const units=forStore(C.temperatures.units,st);
        const grid=h('div',{class:'scroll'},h('table',{class:'grid'},
          h('thead',{},h('tr',{},h('th',{},'Temperature'),...C.temperatures.times.map(t=>h('th',{},t.label)))),
          h('tbody',{},...units.map(u=>h('tr',{},h('td',{},u.name,h('div',{class:'small muted'},rangeText(u))),...C.temperatures.times.map(t=>{const l=[...rows].reverse().find(x=>x.kind==='temp'&&x.item===u.id&&x.slot===t.id);
            return h('td',{style:l&&!l.ok?'color:var(--warn);font-weight:700':''},l?fmtTemp(l.value):'—');}))))));
        const log=h('div',{class:'scroll'},h('table',{},
          h('thead',{},h('tr',{},h('th',{},'Time'),h('th',{},'Type'),h('th',{},'What'),h('th',{},'Value'),h('th',{},'Note'),h('th',{},'By'),h('th',{class:'noprint'},''))),
          h('tbody',{},...rows.map(r=>h('tr',{class:r.ok?'':'bad'},h('td',{},fmtTime(r.at)),h('td',{},KIND[r.kind]),h('td',{},`${itemName(r.kind,r.item,r.slot)} · ${slotName(r.kind,r.slot)}`),
            h('td',{class:'num'},r.value==null?'':fmtTemp(r.value)),h('td',{},[r.kind==='toilet'&&!r.ok?'Not done: '+(C.toilet.items||[]).filter(i=>!(r.details.done||[]).includes(i.id)).map(i=>i.name).join(', '):'',r.details.action||''].filter(Boolean).join(' · ')),
            h('td',{},r.staffName),h('td',{class:'noprint'},h('button',{class:'link',type:'button',onclick:()=>delRow(r)},'Remove')))))));
        box.append(h('details',{class:'hday'},h('summary',{},h('b',{},fmtDate(d,{weekday:'short',day:'numeric',month:'short'})),chip,
          h('span',{class:'small muted'},`Temps ${pr.tDone}/${pr.tAll} · Cleaning ${pr.cDone}/${pr.cAll} · Toilet ${pr.wDone}/${pr.wAll}`),pr.warn?h('span',{class:'chip warn'},`${pr.warn} problem${pr.warn>1?'s':''}`):null),
          grid,rows.length?log:h('p',{class:'muted small'},'Nothing logged.')));
      }
    }
    const pg=periodGroups();
    if(pg.length){
      const pbox=h('div',{class:'card'},h('h3',{},'Weekly and monthly tasks'),h('p',{class:'small muted',style:'margin:0'},'When each task was done in the chosen dates. Red means it was not done in that week or month.'));
      for(const st of stores){
        if(stores.length>1)pbox.append(h('h3',{},(STORES.find(s=>s.id===st)||{}).name));
        for(const g of pg){
          const periods=[];for(let d=H.from;d<=H.to;d=addDays(periodEnd(g,d),1)){const a=periodStart(g,d),b=periodEnd(g,d);periods.push([a,b]);}
          const label=([a,b])=>g.every==='week'?`Week of ${fmtDate(a,{weekday:undefined,day:'numeric',month:'short'})}`:fmtDate(a,{weekday:undefined,day:undefined,month:'long',year:'numeric'});
          const rowsSt=H.rows.filter(r=>r.store===st);
          pbox.append(h('div',{class:'scroll'},h('table',{class:'grid'},
            h('thead',{},h('tr',{},h('th',{},g.label),...periods.map(pr=>h('th',{},label(pr))))),
            h('tbody',{},...forStore(g.tasks,st).map(t=>h('tr',{},h('td',{},t.name),...periods.map(([a,b])=>{
              const done=rowsSt.filter(r=>r.kind==='clean'&&r.item===t.id&&r.slot===g.id&&r.day>=a&&r.day<=b);
              const past=b<S.today;
              return h('td',{style:!done.length&&past?'background:var(--warn-soft);color:var(--warn);font-weight:700':''},
                done.length?done.map(r=>`${fmtDate(r.day,{weekday:'short',day:'numeric',month:undefined})} ${r.staffName}`).join(', '):past?'Not done':'—');})))))));
        }
      }
      kids.push(pbox);
    }
    kids.push(box);
  }
  p.replaceChildren(...kids);
}

// ---------- render all ----------
let pendingRender=false;
function typing(){const a=document.activeElement;return a&&a.closest&&a.closest('main')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);}
function renderPanels(){renderToday();renderTemp();renderClean();renderToilet();if(S.tab==='history')renderHistory();}
function renderAll(){renderShell();renderPanels();}
function softRender(){if(typing()){pendingRender=true;return;}renderAll();}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!typing()){pendingRender=false;renderAll();}},200));

// ---------- login ----------
function logout(){S.code=null;S.mgr=null;delete dev.code;delete dev.mgr;delete dev.me;saveDev();S.rows=[];S.loaded=false;renderAll();}
function logoutMgr(){S.mgr=null;delete dev.mgr;saveDev();if(S.tab==='history')S.tab='today';renderAll();}
$('#logout-btn').addEventListener('click',logout);
$('#gate-form').addEventListener('submit',async e=>{
  e.preventDefault();const code=$('#g-code').value.trim();if(!code)return;$('#g-msg').textContent='Checking…';
  try{const kind=await rpc('check_code',{p:code});
    if(!kind){$('#g-msg').textContent='That team code is not right.';return;}
    S.code=code;dev.code=code;if(kind==='manager'){S.mgr=code;dev.mgr=code;}saveDev();$('#g-code').value='';$('#g-msg').textContent='';renderAll();await refresh();
  }catch(err){$('#g-msg').textContent=errText(err);}
});
$('#mgr-btn').addEventListener('click',async()=>{
  if(S.mgr){logoutMgr();toast('Logged out of management');return;}
  const pw=prompt('Manager password');if(!pw)return;
  try{const kind=await rpc('check_code',{p:pw});if(kind!=='manager'){toast('That password is not right.');return;}
    S.mgr=pw;dev.mgr=pw;saveDev();S.tab='history';lsSet('ngc-checks-tab','history');renderAll();loadHistory();
  }catch(e){toast(errText(e));}
});

// ---------- sync ----------
let refreshing=null;
async function refresh(){
  if(!S.code||!CFG.url)return;if(refreshing)return refreshing;
  refreshing=(async()=>{
    try{const day=S.day,store=S.store;const b=await rpc('checks_day',{p:S.code,store_id:store,day_in:day});
      if(day!==S.day||store!==S.store)return;
      const newToday=b.today||isoToday();if(newToday!==S.today){const wasToday=S.day===S.today;S.today=newToday;if(wasToday){S.day=newToday;S.drafts={};refreshing=null;return refresh();}}
      S.staff=b.staff||[];S.rows=b.rows||[];S.periodic=b.periodic||[];S.loaded=true;S.offline=false;
    }catch(e){if(e.code==='bad_code')logout();else S.offline=true;}
    softRender();
  })();
  try{await refreshing;}finally{refreshing=null;}
}
async function boot(){
  renderAll();if(!CFG.url||!CFG.key){$('#g-msg').textContent='The database connection is missing.';return;}
  if(S.code)await refresh();
  if(S.mgr&&S.tab==='history')loadHistory();
  setInterval(()=>{if(document.visibilityState==='visible')refresh();},30000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh();});
  setInterval(()=>{if(!typing())renderPanels();},60000);
}
boot();
</script>
